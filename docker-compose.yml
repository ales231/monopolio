version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: juego-varones-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: juego_de_varones
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: juego-varones-server
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/juego_de_varones
      JWT_SECRET: change_me_in_production
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CLIENT_URL: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: juego-varones-client
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  postgres_data:
  uploads:
